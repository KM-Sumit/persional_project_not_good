services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: uci
      POSTGRES_PASSWORD: uci
      POSTGRES_DB: uci
    ports:
      - '5436:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uci']
      interval: 2s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - '6382:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      retries: 20

volumes:
  pgdata:
